name: renalloc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renalloc}
      POSTGRES_USER: ${POSTGRES_USER:-renalloc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renalloc}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - renalloc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  renalloc_postgres_data:
